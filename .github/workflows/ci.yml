name: Antigravity Link CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Zero-Dependency Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Validate Linux Setup Scripts
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh
          bash -n install_linux_shortcuts.sh
          bash install_linux_shortcuts.sh

      - name: Validate Windows Setup Scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File install_windows_shortcuts.ps1
