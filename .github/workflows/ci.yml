name: Antigravity Link CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Zero-Dependency Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: Validate Plugin Manifests
        run: |
          python -c "import json; json.load(open('plugin.json')); json.load(open('hooks.json')); json.load(open('mcp_config.json'))"
          python -c "import json; json.load(open('.agents/plugins/antigravity-link/plugin.json')); json.load(open('.agents/plugins/antigravity-link/hooks.json')); json.load(open('.agents/plugins/antigravity-link/mcp_config.json'))"

      - name: Validate MCP Server Communication
        run: |
          python -c "
          import subprocess, json, sys
          p = subprocess.Popen([sys.executable, 'mcp_server.py'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
          init_req = json.dumps({'jsonrpc': '2.0', 'id': 1, 'method': 'initialize'}) + '\n'
          list_req = json.dumps({'jsonrpc': '2.0', 'id': 2, 'method': 'tools/list'}) + '\n'
          out, _ = p.communicate(input=init_req + list_req, timeout=10)
          lines = [json.loads(line) for line in out.strip().splitlines() if line.strip()]
          assert any(r.get('id') == 1 and 'serverInfo' in r.get('result', {}) for r in lines), 'MCP initialize failed'
          assert any(r.get('id') == 2 and 'tools' in r.get('result', {}) for r in lines), 'MCP tools/list failed'
          "
